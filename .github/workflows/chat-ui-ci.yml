name: Frontend CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            services/chat-ui/package-lock.json
            services/chat-kiosk-ui/package-lock.json

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install chat-ui dependencies
        working-directory: services/chat-ui
        run: npm ci

      - name: Run chat-ui lint
        working-directory: services/chat-ui
        run: npm run lint

      - name: Run chat-ui build
        working-directory: services/chat-ui
        run: npm run build

      - name: Run chat-ui unit tests
        working-directory: services/chat-ui
        run: npm run test:unit

      - name: Install chat-kiosk-ui dependencies
        working-directory: services/chat-kiosk-ui
        run: npm ci

      - name: Run chat-kiosk-ui build
        working-directory: services/chat-kiosk-ui
        run: npm run build

      - name: Run chat-kiosk-ui unit tests
        working-directory: services/chat-kiosk-ui
        run: npm run test:unit

      - name: Install chat-proxy test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e services/chat-proxy pytest

      - name: Run chat-proxy tests
        run: python -m pytest services/chat-proxy/tests

      - name: Install Playwright browsers
        working-directory: services/chat-ui
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E and visual tests
        working-directory: services/chat-ui
        run: npm run test:e2e

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build chat-ui container image
        run: docker build -f services/chat-ui/Dockerfile -t pixie-chat-ui:ci .

      - name: Build chat-kiosk-ui container image
        run: docker build -f services/chat-kiosk-ui/Dockerfile -t pixie-chat-kiosk-ui:ci .

      - name: Build chat-proxy container image
        run: docker build -f services/chat-proxy/Dockerfile -t pixie-chat-ui-proxy:ci services/chat-proxy

      - name: Build chat-kiosk-ui arm64 image
        run: docker buildx build --platform linux/arm64 -f services/chat-kiosk-ui/Dockerfile -t pixie-chat-kiosk-ui:ci-arm64 --load .

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            services/chat-ui/playwright-report
            services/chat-ui/test-results
