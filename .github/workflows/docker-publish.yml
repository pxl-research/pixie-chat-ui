name: Docker Publish

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine image name
        id: image
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          repo_name="${GITHUB_REPOSITORY#*/}"
          image="${owner}/${repo_name}"
          echo "name=${image}" >> "$GITHUB_OUTPUT"

      - name: Extract Docker metadata (chat-ui)
        id: meta-ui
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}
          tags: |
            type=ref,event=branch
            type=sha

      - name: Build and push chat-ui image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./services/chat-ui/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta-ui.outputs.tags }}
          labels: ${{ steps.meta-ui.outputs.labels }}

      - name: Extract Docker metadata (chat-kiosk-ui)
        id: meta-kiosk
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}-kiosk-ui
          tags: |
            type=ref,event=branch
            type=sha

      - name: Build and push chat-kiosk-ui image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./services/chat-kiosk-ui/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta-kiosk.outputs.tags }}
          labels: ${{ steps.meta-kiosk.outputs.labels }}

      - name: Extract Docker metadata (chat-proxy)
        id: meta-proxy
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}-proxy
          tags: |
            type=ref,event=branch
            type=sha

      - name: Build and push chat-proxy image
        uses: docker/build-push-action@v6
        with:
          context: ./services/chat-proxy
          file: ./services/chat-proxy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta-proxy.outputs.tags }}
          labels: ${{ steps.meta-proxy.outputs.labels }}
