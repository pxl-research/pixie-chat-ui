services:
  gateway:
    image: caddy:2.7
    container_name: chat-gateway
    depends_on:
      - proxy
      - ui
    ports:
      - "3000:3000"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    networks:
      - default

  proxy:
    image: ${CHAT_PROXY_IMAGE:-ghcr.io/pxl-research/pixie-chat-ui-proxy:main}
    build:
      context: ../../services/chat-proxy
    container_name: chat-proxy
    env_file: ../../.env.dev
    environment:
      PIXIE_CORE_API_BASE_URL: http://recommender-api:8000
      PIXIE_INFORMER_API_BASE_URL: http://informer-api:8000
      PIXIE_QUESTIONER_API_BASE_URL: http://questioner-api:8000
      AUDIT_LOGGING_ENABLED: ${AUDIT_LOGGING_ENABLED:-true}
      AUDIT_API_URL: ${AUDIT_API_URL:-http://audit-api:8000}
      AUDIT_API_KEY: ${AUDIT_API_KEY:-}
      AUDIT_LOG_TIMEOUT_MS: ${AUDIT_LOG_TIMEOUT_MS:-250}
      PIXIE_PROFILE: ${PIXIE_PROFILE:-informer}
    networks:
      - default
      - pixie

  ui:
    image: ${CHAT_UI_IMAGE:-ghcr.io/pxl-research/pixie-chat-ui:main}
    build:
      context: ../../services/chat-ui
    container_name: chat-ui
    env_file: ../../.env.dev
    depends_on:
      - proxy
    networks:
      - default
      - pixie

networks:
  pixie:
    external: true
    name: pixie-network
